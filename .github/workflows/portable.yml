name: Laptop install

on:
  pull_request:
    paths:
      - "commoncause/**"
      - "tests/**"
      - "topologies/**"
      - "queries/**"
      - "catalog/**"
      - "sim/**"
      - "pyproject.toml"
      - ".github/workflows/portable.yml"
  push:
    branches: [main]
    paths:
      - "commoncause/**"
      - "tests/**"
      - "topologies/**"
      - "queries/**"
      - "catalog/**"
      - "sim/**"
      - "pyproject.toml"
      - ".github/workflows/portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laptop:
    name: Python 3.11 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create a fresh environment
        run: >-
          python -c "import os, venv; from pathlib import Path;
          root = Path(os.environ['RUNNER_TEMP']) / 'judge-env';
          venv.create(root, with_pip=True);
          binaries = root / ('Scripts' if os.name == 'nt' else 'bin');
          Path(os.environ['GITHUB_PATH']).open('a').write(str(binaries) + '\n')"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q --basetemp "${{ runner.temp }}/pytest"
      - name: Follow the laptop quickstart
        run: |
          commoncause diagnose --last
          commoncause explain dx:f1-fixture:1
          commoncause impact REG_B
          commoncause run --virtual-bench --scenario sim/scenarios/f1.json --run portable-f1 --db "${{ runner.temp }}/portable/store" --recording "${{ runner.temp }}/portable/capture.jsonl" --tui
          commoncause matrix "${{ runner.temp }}/portable/capture.jsonl" --expect-count 1 --min-top-one 1
          commoncause replay "${{ runner.temp }}/portable/capture.jsonl" --topology topologies/cubesat-bench.yaml --db "${{ runner.temp }}/portable/replayed"
          commoncause benchmark --db "${{ runner.temp }}/portable/replayed" --samples 100 --json
      - name: Check Mac export and MCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sSfL https://relatedb.ai/install.sh -o "$RUNNER_TEMP/relate-install.sh"
          bash "$RUNNER_TEMP/relate-install.sh"
          commoncause downlink --db "$RUNNER_TEMP/portable/replayed" --out "$RUNNER_TEMP/portable/downlink" --relate "$HOME/.local/bin/relate"
          RELATE_CLI="$HOME/.local/bin/relate" python -m pytest -q tests/test_mcp.py --basetemp "$RUNNER_TEMP/pytest-mcp"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: laptop-${{ runner.os }}
          path: ${{ runner.temp }}/portable
          retention-days: 30
