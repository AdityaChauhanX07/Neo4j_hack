name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            arch: x64
            runner: ubuntu-24.04
          - python: "3.11"
            arch: x64
            runner: ubuntu-latest
          - python: "3.13"
            arch: x64
            runner: ubuntu-latest
          - python: "3.11"
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[board,test]"
      - run: python -m pytest -q
      - name: Verify the recorded fault fixtures
        run: |
          python sim/bench.py > "$RUNNER_TEMP/bench-fixtures.jsonl"
          python sim/quad.py > "$RUNNER_TEMP/quadcopter.jsonl"
          {
            echo '### Synthetic recording results'
            echo
            echo '```text'
            commoncause matrix "$RUNNER_TEMP/bench-fixtures.jsonl" --bench-repeats 1 --min-top-one 1
            commoncause matrix "$RUNNER_TEMP/quadcopter.jsonl" --topology topologies/quadcopter.yaml --expect-count 3 --min-top-one 1
            commoncause benchmark --samples 100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
