name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - name: Score synthetic recordings
        run: |
          python sim/quad.py > "$RUNNER_TEMP/quadcopter.jsonl"
          {
            echo '### Synthetic recording results'
            echo
            echo '```text'
            commoncause matrix recordings/f1-fixture.jsonl
            commoncause matrix "$RUNNER_TEMP/quadcopter.jsonl" --topology topologies/quadcopter.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
