name: Virtual endurance

on:
  pull_request:
    paths:
      - "scripts/soak.py"
      - ".github/workflows/endurance.yml"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds of live healthy capture
        default: "3600"
        required: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOAK_SECONDS: ${{ inputs.duration || '5' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Measure healthy capture
        run: python -m scripts.soak --duration "$SOAK_SECONDS" --out "$RUNNER_TEMP/endurance"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: virtual-endurance
          path: ${{ runner.temp }}/endurance
          retention-days: 30
