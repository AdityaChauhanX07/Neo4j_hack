name: Ground view

on:
  pull_request:
    paths:
      - "ground/**"
      - "queries/**"
      - "sim/**"
      - "topologies/**"
      - "catalog/**"
      - "commoncause/**"
      - "recordings/**"
      - "downlink/common-cause.json"
      - "pyproject.toml"
      - ".github/workflows/ground.yml"
  push:
    branches: [main]
    paths:
      - "ground/**"
      - "queries/**"
      - "sim/**"
      - "topologies/**"
      - "catalog/**"
      - "commoncause/**"
      - "recordings/**"
      - "downlink/common-cause.json"
      - "pyproject.toml"
      - ".github/workflows/ground.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - name: Replay and export a fresh downlink
        run: |
          curl -sSfL https://relatedb.ai/install.sh -o "$RUNNER_TEMP/relate-install.sh"
          bash "$RUNNER_TEMP/relate-install.sh"
          commoncause diagnose --last
          commoncause explain dx:f1-fixture:1
          commoncause impact REG_B
          commoncause replay recordings/f1-fixture.jsonl --topology topologies/cubesat-bench.yaml --db "$RUNNER_TEMP/commoncause-store"
          commoncause downlink --db "$RUNNER_TEMP/commoncause-store" --out "$RUNNER_TEMP/commoncause-downlink" --relate "$HOME/.local/bin/relate"
      - name: Verify read-only MCP and live downlink
        run: RELATE_CLI="$HOME/.local/bin/relate" python -m pytest -q tests/test_mcp.py tests/test_live_store.py --basetemp "$RUNNER_TEMP/pytest-mcp"
      - name: Capture, replay, and export a virtual bench episode
        run: |
          commoncause run --virtual-bench --scenario sim/scenarios/f1.json --run virtual-f1 --db "$RUNNER_TEMP/virtual-store" --recording "$RUNNER_TEMP/virtual-f1.jsonl" --tui
          commoncause matrix "$RUNNER_TEMP/virtual-f1.jsonl" --expect-count 1 --min-top-one 1
          commoncause replay "$RUNNER_TEMP/virtual-f1.jsonl" --topology topologies/cubesat-bench.yaml --db "$RUNNER_TEMP/virtual-replayed"
          commoncause downlink --db "$RUNNER_TEMP/virtual-replayed" --out "$RUNNER_TEMP/virtual-downlink" --relate "$HOME/.local/bin/relate"
      - run: python -m sim.demo
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ground/package-lock.json
      - run: npm --prefix ground ci
      - run: npm --prefix ground test
      - run: npm --prefix ground run build
      - run: npx playwright install --with-deps chromium
        working-directory: ground
      - run: npm --prefix ground run test:browser
        env:
          COMMONCAUSE_DOWNLINK: ${{ runner.temp }}/commoncause-downlink/common-cause.json
          COMMONCAUSE_VIRTUAL_DOWNLINK: ${{ runner.temp }}/virtual-downlink/common-cause.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ground-browser-checks
          path: ground/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'pull_request'
        with:
          name: ground-preview
          path: ground/dist
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ground/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
