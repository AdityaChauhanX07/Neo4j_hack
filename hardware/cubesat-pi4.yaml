buses:
  I2C-1: 1
  I2C-3: 3
  UART0: {port: /dev/serial0, baud: 115200}

devices:
  imu:
    chip: mpu6050
    address: 0x68
    outputs: {imu.gyro: gyro, imu.accel: accel}
  mag:
    chip: qmc5883l
    address: 0x0d
    outputs: {mag.field: field}
  epsmon:
    chip: ina219
    address: 0x40
    shunt_ohms: 0.1
    outputs: {eps.regb.voltage: voltage, eps.regb.current: current}
  thermal:
    chip: bme280
    address: 0x76
    outputs: {thermal.temp: temperature}
  sun1:
    chip: bh1750
    address: 0x23
    outputs: {sun1.lux: lux}
  sun2:
    chip: bh1750
    address: 0x5c
    outputs: {sun2.lux: lux}
  payload:
    chip: bme280
    address: 0x77
    outputs: {payload.temp: temperature, payload.pressure: pressure}
  radio:
    chip: heartbeat
    outputs: {radio.heartbeat: counter}

stall_channel: imu.gyro
