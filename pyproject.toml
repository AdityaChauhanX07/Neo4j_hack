[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commoncause"
version = "0.1.0"
description = "Shared fault diagnosis for a CubeSat bench"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["relate-db==1.0.1", "PyYAML>=6"]

[project.scripts]
commoncause = "commoncause.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
board = ["smbus2>=0.5,<1", "pyserial>=3.5,<4"]

[tool.setuptools]
packages = [
    "commoncause", "commoncause.board", "commoncause.board.drivers",
    "commoncause.queries", "commoncause.catalog",
]
package-dir = {"commoncause.queries" = "queries", "commoncause.catalog" = "catalog"}

[tool.setuptools.package-data]
"commoncause.queries" = ["*.cypher"]
"commoncause.catalog" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
